<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- ✅ Vite: files in /public are served at the site root -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DaySpring" />

  <!-- ✅ Primary SEO -->
  <title>DaySpring — Shop products in Nigeria</title>
  <meta name="description" content="Buy quality products on DaySpring. Fast delivery and trusted suppliers." />

  <meta name="application-name" content="DaySpring House" />
  <meta name="theme-color" content="#ffffff" />

  <!-- ✅ Canonical (SPA default; product pages can override later with React head tags) -->
  <link rel="canonical" href="%VITE_APP_URL%/" />

  <!-- ✅ Open Graph -->
  <meta property="og:site_name" content="DaySpring House" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DaySpring House — Shop" />
  <meta property="og:description"
    content="DaySpring House — shop quality products in Nigeria. Browse our catalogue, add to cart, and checkout securely." />
  <meta property="og:url" content="%VITE_APP_URL%/" />
  <meta property="og:image" content="%VITE_APP_URL%/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ✅ Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DaySpring House — Shop" />
  <meta name="twitter:description"
    content="DaySpring House — shop quality products in Nigeria. Browse our catalogue, add to cart, and checkout securely." />
  <meta name="twitter:image" content="%VITE_APP_URL%/og-image.jpg" />

  <!-- ✅ Structured data (helps Google show the correct site name and, -->
  <!-- importantly, correctly identify DaySpring House as an e-commerce -->
  <!-- marketplace — distinct from unrelated businesses/entities that -->
  <!-- happen to share the "Dayspring" name, e.g. care agencies). -->
  <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"%VITE_APP_URL%/#website","name":"DaySpring House","url":"%VITE_APP_URL%","potentialAction":{"@type":"SearchAction","target":"%VITE_APP_URL%/?q={search_term_string}","query-input":"required name=search_term_string"}},{"@type":"OnlineStore","@id":"%VITE_APP_URL%/#organization","name":"DaySpring House","alternateName":"DaySpring","url":"%VITE_APP_URL%","logo":"%VITE_APP_URL%/og-image.jpg","description":"DaySpring House is an online e-commerce marketplace connecting trusted suppliers with shoppers in Nigeria, offering a wide range of consumer products with fast delivery and secure checkout.","areaServed":"NG"}]}
    </script>

  <!-- ✅ CSP (UI) -->
  <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        frame-ancestors 'none';
        form-action 'self';
        img-src 'self' data: https:;
        font-src 'self' data: https:;
        style-src 'self' 'unsafe-inline' https://*.tawk.to;
        script-src 'self' https://js.paystack.co https://*.tawk.to 'sha256-Crr0k6ehqLlwP6rZg5dzQbxqTcCHFGnFZyNBFv3d/tw=';
        connect-src 'self' %VITE_API_URL% https://api.paystack.co https://*.tawk.to wss://*.tawk.to capacitor: ionic: http://10.0.2.2:5173 ws://10.0.2.2:5173;
        frame-src 'self' https://*.tawk.to;
      " />
</head>

<body>
  <div id="root"></div>
  <div id="modal-root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
